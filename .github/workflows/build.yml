name: Build GroundJoin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o GroundJoin.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: GroundJoin/pom.xml
      - run: mvn --batch-mode clean package
        working-directory: GroundJoin
      - uses: actions/upload-artifact@v4
        with:
          name: GroundJoin
          path: GroundJoin/target/GroundJoin-1.0.jar
